<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess-O-Pedia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <div class="menu_toggle">
      <!-- Hidden Checkbox trick for toggle behavior -->
      <input type="checkbox" />

      <!-- Hamburger Lines -->
      <span></span>
      <span></span>
      <span></span>

      <!-- Navigation Links -->
      <ul class="menu_links">
        <li><a href="chapters/ch1.html">Chapter 1 : Introduction</a></li>
        <li><a href="chapters/ch2.html">Chapter 2 : The Pieces in Chess</a></li>
        <li><a href="chapters/ch3.html">Chapter 3 : Algebraic Chess Notations</a></li>
      </ul>
    </div>
  </nav>
<button id="theme-toggle" aria-label="Toggle Theme">
  <svg viewBox="0 0 24 24">
    <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4C12.92 3.04 12.46 3 12 3z"/>
  </svg>
</button>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const toggleBtn = document.getElementById('theme-toggle');
    if (!toggleBtn) return;

    // Load saved preference
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark-mode');
    }

    // Toggle class allowing CSS to handle the smooth color fade
    toggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });
  });
</script>
<h1 class="header-title">Chess-0-Pedia</h1>

<hr class="hr-gradient" />

</body>
</html>
