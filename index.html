<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <div class="menu_toggle">
      <!-- Hidden Checkbox trick for toggle behavior -->
      <input type="checkbox" />

      <!-- Hamburger Lines -->
      <span></span>
      <span></span>
      <span></span>

      <!-- Navigation Links -->
      <ul class="menu_links">
        <li><a href="chapters/ch1.html">Chapter 1 : Introduction</a></li>
        <li><a href="chapters/ch2.html">Chapter 2 : The Pieces in Chess</a></li>
        <li><a href="chapters/ch3.html">Chapter 3 : Algebraic Chess Notations</a></li>
      </ul>
    </div>
  </nav>
<button id="theme-toggle" aria-label="Toggle theme">
  <!-- Moon Icon (Visible in Light Mode) -->
  <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
    <path d="M21.64 13a1 1 0 0 0-1.05-.14 8.05 8.05 0 0 1-3.37.73A8.15 8.15 0 0 1 9.08 5.49a8.59 8.59 0 0 1 .25-2A1 1 0 0 0 8 2.36 10.14 10.14 0 1 0 22 14.05a1 1 0 0 0-.36-1.05z"/>
  </svg>
  
  <!-- Sun Icon (Visible in Dark Mode) -->
  <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
    <path d="M12 7a5 5 0 1 0 5 5 5 5 0 0 0-5-5zm0 8a3 3 0 1 1 3-3 3 3 0 0 1-3 3zm0-13a1 1 0 0 0 1-1V2a1 1 0 0 0-2 0v1a1 1 0 0 0 1 1zm0 18a1 1 0 0 0-1 1v1a1 1 0 0 0 2 0v-1a1 1 0 0 0-1-1zm10-9h-1a1 1 0 0 0 0 2h1a1 1 0 0 0 0-2zM4 12a1 1 0 0 0-1-1H2a1 1 0 0 0 0 2h1a1 1 0 0 0 1-1zm14.36-7.36a1 1 0 0 0-1.42 1.42l.71.71a1 1 0 0 0 1.42-1.42zM6.34 17.66a1 1 0 0 0-1.42 1.42l.71.71a1 1 0 0 0 1.42-1.42zm12.02 1.42a1 1 0 0 0 1.42-1.42l-.71-.71a1 1 0 0 0-1.42 1.42zM6.34 6.34a1 1 0 0 0 1.42-1.42l-.71-.71a1 1 0 0 0-1.42 1.42z"/>
  </svg>
</button>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const toggleBtn = document.getElementById('theme-toggle');
    if (!toggleBtn) return;

    // Load saved preference
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark-mode');
    }

    // Toggle class allowing CSS to handle the smooth color fade
    toggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });
  });
</script>
<h1 class="header-title">Chess-0-Pedia</h1>

<hr class="hr-gradient" />

</body>
</html>
