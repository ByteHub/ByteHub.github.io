<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess-O-Pedia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <div class="menu_toggle">
      <!-- Hidden Checkbox trick for toggle behavior -->
      <input type="checkbox" />

      <!-- Hamburger Lines -->
      <span></span>
      <span></span>
      <span></span>

      <!-- Navigation Links -->
      <ul class="menu_links">
        <li><a href="chapters/ch1.html">Chapter 1 : Introduction</a></li>
        <li><a href="chapters/ch2.html">Chapter 2 : The Pieces in Chess</a></li>
        <li><a href="chapters/ch3.html">Chapter 3 : Algebraic Chess Notations</a></li>
      </ul>
    </div>
  </nav>
<button id="theme-toggle" aria-label="Toggle theme">
  <!-- Moon Icon (Visible in Light Mode) -->
  <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
    <path d="M21.64 13a1 1 0 0 0-1.05-.14 8.05 8.05 0 0 1-3.37.73A8.15 8.15 0 0 1 9.08 5.49a8.59 8.59 0 0 1 .25-2A1 1 0 0 0 8 2.36 10.14 10.14 0 1 0 22 14.05a1 1 0 0 0-.36-1.05z"/>
  </svg>
  
  <!-- Sun Icon (Visible in Dark Mode) -->
  <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
  <path d="M12 18C8.68629 18 6 15.3137 6 12C6 8.68629 8.68629 6 12 6C15.3137 6 18 8.68629 18 12C18 15.3137 15.3137 18 12 18ZM11 1H13V4H11V1ZM11 20H13V23H11V20ZM3.51472 4.92893L4.92893 3.51472L7.05025 5.63604L5.63604 7.05025L3.51472 4.92893ZM16.9497 18.364L18.364 16.9497L20.4853 19.0711L19.0711 20.4853L16.9497 18.364ZM1 11H4V13H1V11ZM20 11H23V13H20V11ZM4.92893 20.4853L3.51472 19.0711L5.63604 16.9497L7.05025 18.364L4.92893 20.4853ZM18.364 3.51472L19.0711 4.92893L16.9497 7.05025L15.5355 5.63604L18.364 3.51472Z"/>
</svg>

</button>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const toggleBtn = document.getElementById('theme-toggle');
    if (!toggleBtn) return;

    // Load saved preference
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark-mode');
    }

    // Toggle class allowing CSS to handle the smooth color fade
    toggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });
  });
</script>
<h1 class="header-title">Chess-0-Pedia</h1>

<hr class="hr-gradient" />

</body>
</html>
